<!-- Lumary OS — Pattern: Hero Centered -->
<!-- Use: Best for construction, professional services, agencies -->
<!-- Experience: The Awakening -->

<section class="hero-centered min-h-screen flex items-center justify-center relative overflow-hidden">
  <!-- Background -->
  <div class="absolute inset-0">
    <img src="hero-bg.webp" alt=""
         class="w-full h-full object-cover"
         loading="eager" />
    <div class="absolute inset-0 bg-gradient-to-b from-primary/70 via-primary/50 to-primary/90"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 text-center max-w-4xl px-6">
    <h1 class="hero-heading text-5xl md:text-7xl lg:text-8xl font-bold text-white leading-tight mb-6">
      Build Beyond Boundaries
    </h1>
    <p class="hero-subtext text-lg md:text-xl text-muted max-w-2xl mx-auto mb-10">
      We deliver premium construction services for ambitious projects across Tanzania.
    </p>
    <a href="#" class="hero-cta inline-flex items-center gap-2 px-10 py-5 bg-accent text-white rounded-xl font-semibold text-lg
                      hover:bg-accent-light hover:-translate-y-0.5 transition-all duration-300 shadow-lg shadow-accent/25">
      Start Your Project
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
      </svg>
    </a>
  </div>

  <!-- Scroll Indicator -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 text-muted">
    <span class="text-sm">Scroll to explore</span>
    <div class="w-6 h-10 border-2 border-muted rounded-full flex justify-center p-1">
      <div class="w-1.5 h-2.5 bg-accent rounded-full animate-bounce"></div>
    </div>
  </div>
</section>
