<!-- Lumary OS — Pattern: Hero Split Layout -->
<!-- Use: Best for SaaS, features, product pages -->
<!-- Experience: The Awakening (variant) -->

<section class="hero-split min-h-screen flex flex-col md:flex-row">
  <!-- Left: Content -->
  <div class="flex-1 flex items-center justify-center px-8 py-24">
    <div class="max-w-xl">
      <span class="inline-block text-sm font-semibold text-accent uppercase tracking-widest mb-4">
        Tagline
      </span>
      <h1 class="text-5xl md:text-7xl font-bold leading-tight mb-6">
        Headline That Converts
      </h1>
      <p class="text-lg text-muted mb-8 max-w-lg">
        Supporting copy that explains the value proposition clearly and concisely.
      </p>
      <div class="flex flex-col sm:flex-row gap-4">
        <a href="#" class="btn-primary text-center px-8 py-4 bg-accent text-white rounded-xl font-semibold
                          hover:bg-accent-light transition-all duration-300">
          Primary CTA
        </a>
        <a href="#" class="btn-secondary text-center px-8 py-4 border border-accent text-accent rounded-xl font-semibold
                          hover:bg-accent/10 transition-all duration-300">
          Secondary CTA
        </a>
      </div>
    </div>
  </div>

  <!-- Right: Visual -->
  <div class="flex-1 relative min-h-[50vh] md:min-h-screen overflow-hidden">
    <img src="hero-visual.webp" alt=""
         class="w-full h-full object-cover absolute inset-0"
         loading="eager" />
    <div class="absolute inset-0 bg-gradient-to-r from-primary/50 to-transparent md:from-primary/80"></div>
  </div>
</section>
