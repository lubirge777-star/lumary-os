<!-- Lumary OS — Pattern: Floating Navigation -->
<!-- Use: All projects (default) -->
<!-- Behavior: Transparent on hero, glassmorphism on scroll -->

<nav id="navbar" class="fixed top-4 left-4 right-4 z-50 transition-all duration-500">
  <div class="max-w-6xl mx-auto px-6 py-4 rounded-2xl
              transition-all duration-500
              bg-transparent">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <a href="/" class="text-xl font-bold text-white">
        Lumary
      </a>

      <!-- Desktop Links -->
      <div class="hidden md:flex items-center gap-8">
        <a href="#services" class="text-sm text-white/80 hover:text-white transition-colors duration-200">
          Services
        </a>
        <a href="#work" class="text-sm text-white/80 hover:text-white transition-colors duration-200">
          Our Work
        </a>
        <a href="#process" class="text-sm text-white/80 hover:text-white transition-colors duration-200">
          Process
        </a>
        <a href="#contact" class="text-sm text-white/80 hover:text-white transition-colors duration-200">
          Contact
        </a>
        <a href="#contact" class="px-5 py-2.5 bg-accent text-white rounded-lg text-sm font-semibold
                          hover:bg-accent-light transition-all duration-300">
          Get a Quote
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button class="md:hidden text-white" aria-label="Toggle menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>
</nav>

<script>
// Navbar scroll behavior
const navbar = document.getElementById('navbar');
const navInner = navbar.querySelector('div');

window.addEventListener('scroll', () => {
  if (window.scrollY > 100) {
    navInner.classList.remove('bg-transparent');
    navInner.classList.add('bg-primary/90', 'backdrop-blur-xl', 'shadow-lg', 'border', 'border-white/10');
    navInner.style.marginTop = '0';
  } else {
    navInner.classList.add('bg-transparent');
    navInner.classList.remove('bg-primary/90', 'backdrop-blur-xl', 'shadow-lg', 'border', 'border-white/10');
  }
});
</script>
