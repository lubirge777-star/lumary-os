<!-- Lumary OS — Pattern: Masonry Gallery -->
<!-- Use: Portfolio, project showcase, photography -->
<!-- Library: CSS columns (no JS required) -->

<section class="gallery-section py-24 px-6">
  <div class="max-w-6xl mx-auto">
    <div class="text-center mb-16">
      <h2 class="text-4xl font-bold mb-4">Our Projects</h2>
      <p class="text-muted max-w-xl mx-auto">Each project reflects our commitment to quality and craftsmanship.</p>
    </div>
    
    <div class="columns-1 md:columns-2 lg:columns-3 gap-6 space-y-6">
      <div class="gallery-item break-inside-avoid group relative rounded-2xl overflow-hidden cursor-pointer">
        <img src="project-1.webp" alt="Project 1" class="w-full h-auto" loading="lazy" />
        <div class="absolute inset-0 bg-primary/70 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
          <div class="text-center p-6">
            <h3 class="text-lg font-semibold mb-2">Project Title</h3>
            <p class="text-sm text-muted">Project description</p>
          </div>
        </div>
      </div>
      
      <div class="gallery-item break-inside-avoid group relative rounded-2xl overflow-hidden cursor-pointer">
        <img src="project-2.webp" alt="Project 2" class="w-full h-auto" loading="lazy" />
        <div class="absolute inset-0 bg-primary/70 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
          <div class="text-center p-6">
            <h3 class="text-lg font-semibold mb-2">Project Title</h3>
            <p class="text-sm text-muted">Project description</p>
          </div>
        </div>
      </div>
      
      <div class="gallery-item break-inside-avoid group relative rounded-2xl overflow-hidden cursor-pointer">
        <img src="project-3.webp" alt="Project 3" class="w-full h-auto" loading="lazy" />
        <div class="absolute inset-0 bg-primary/70 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
          <div class="text-center p-6">
            <h3 class="text-lg font-semibold mb-2">Project Title</h3>
            <p class="text-sm text-muted">Project description</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
.columns-1 { column-count: 1; }
@media (min-width: 768px) { .columns-2 { column-count: 2; } }
@media (min-width: 1024px) { .columns-3 { column-count: 3; } }
.gallery-item img { display: block; width: 100%; }
</style>
