<!-- Lumary OS — Pattern: CTA Section -->
<!-- Use: Final call-to-action before footer -->
<!-- Emotion: Urgency + Trust -->

<section class="cta-section py-24 px-6 relative overflow-hidden">
  <!-- Background -->
  <div class="absolute inset-0">
    <div class="absolute inset-0 bg-gradient-to-br from-accent/20 via-primary to-primary/90"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_30%_50%,rgba(255,255,255,0.05),transparent_50%)]"></div>
  </div>

  <div class="relative z-10 max-w-3xl mx-auto text-center">
    <h2 class="text-4xl md:text-5xl font-bold text-white mb-6">
      Ready to Build Something Great?
    </h2>
    <p class="text-lg text-gray-300 mb-10 max-w-xl mx-auto">
      Let's discuss your project. No commitement, just a conversation about what's possible.
    </p>
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <a href="#contact" class="px-10 py-5 bg-accent text-white rounded-xl font-semibold text-lg
                              hover:bg-accent-light hover:-translate-y-0.5 
                              transition-all duration-300 shadow-lg shadow-accent/25">
        Start Your Project
      </a>
      <a href="tel:+255712345678" class="px-10 py-5 bg-white/5 text-white rounded-xl font-semibold text-lg border border-white/10
                              hover:bg-white/10 transition-all duration-300">
        Call Us
      </a>
    </div>
    <p class="text-sm text-muted mt-6">Free consultation • No obligation • Quick turnaround</p>
  </div>
</section>
