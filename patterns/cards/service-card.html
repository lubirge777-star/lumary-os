<!-- Lumary OS — Pattern: Service Card -->
<!-- Use: Services section, features grid -->
<!-- Experience: The Cascade (card stagger on scroll) -->

<div class="card group p-8 rounded-xl border border-white/10 bg-secondary
            hover:-translate-y-2 hover:shadow-xl hover:border-accent/30
            transition-all duration-300 cursor-pointer">
  <!-- Icon -->
  <div class="w-14 h-14 bg-accent/10 rounded-xl flex items-center justify-center mb-6
              group-hover:bg-accent/20 transition-colors duration-300">
    <i data-lucide="building-2" class="w-7 h-7 text-accent"></i>
  </div>

  <!-- Content -->
  <h3 class="text-xl font-semibold mb-3 group-hover:text-accent transition-colors duration-300">
    Service Title
  </h3>
  <p class="text-muted leading-relaxed">
    Description of the service or feature. Keep it concise and benefit-focused.
  </p>

  <!-- Optional Link -->
  <a href="#" class="inline-flex items-center gap-2 mt-6 text-sm font-medium text-accent
                    opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0
                    transition-all duration-300">
    Learn more
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
    </svg>
  </a>
</div>
