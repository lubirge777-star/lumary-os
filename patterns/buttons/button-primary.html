<!-- Lumary OS — Button: Primary -->
<!-- Use: Primary CTAs, form submissions, main actions -->
<!-- States: rest, hover, focus, active, loading, disabled -->

<button class="btn-primary relative inline-flex items-center justify-center gap-2 px-8 py-4 
               bg-accent text-white font-semibold rounded-xl
               hover:bg-accent-light hover:-translate-y-0.5
               focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-primary
               active:scale-[0.97]
               disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0
               transition-all duration-200">
  <span class="btn-label">Get Started</span>
  <svg class="btn-icon w-5 h-5 transition-transform duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
  </svg>
</button>
