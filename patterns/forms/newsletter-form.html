<!-- Lumary OS — Pattern: Newsletter Signup -->
<!-- Use: Email capture, lead generation, blog subscription -->

<div class="newsletter-form max-w-md mx-auto">
  <div class="text-center mb-6">
    <h3 class="text-lg font-semibold mb-2">Stay Updated</h3>
    <p class="text-sm text-muted">Get the latest insights delivered to your inbox.</p>
  </div>
  <form class="flex gap-3">
    <input type="email" placeholder="Enter your email" required
           class="flex-1 px-4 py-3 bg-transparent border border-white/10 rounded-xl text-white
                  focus:border-accent focus:ring-1 focus:ring-accent outline-none
                  placeholder:text-gray-500 transition-all duration-200" />
    <button type="submit" class="px-6 py-3 bg-accent text-primary rounded-xl font-semibold hover:bg-accent/90 transition-all whitespace-nowrap">Subscribe</button>
  </form>
  <p class="text-xs text-muted text-center mt-3">No spam. Unsubscribe anytime.</p>
</div>
