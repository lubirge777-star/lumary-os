<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#16213e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="nav-scrolled" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#16213e" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glass">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Page content -->
  <rect x="40" y="100" width="720" height="20" rx="4" fill="#2d2d44" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.3;0.15;0.3" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="40" y="135" width="500" height="12" rx="3" fill="#2d2d44" opacity="0.2"/>
  <rect x="40" y="160" width="600" height="12" rx="3" fill="#2d2d44" opacity="0.2"/>
  <rect x="40" y="200" width="720" height="180" rx="8" fill="#1e1e33" opacity="0.15"/>

  <!-- Nav background bar -->
  <rect x="0" y="0" width="800" height="75" fill="url(#nav)" filter="url(#shadow)" rx="0">
    <animate attributeName="height" values="75;60;60;75" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="0;0;0;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Glass effect overlay on nav -->
  <rect x="0" y="0" width="800" height="75" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05" rx="0">
    <animate attributeName="height" values="75;60;60;75" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Logo mark -->
  <text x="50" y="32" font-family="system-ui, sans-serif" font-size="14" fill="#a78bfa" font-weight="800" letter-spacing="2">
    ✦ LUMARY
    <animate attributeName="y" values="32;27;27;32" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Nav Links -->
  <!-- Home -->
  <text x="520" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">
    Home
    <animate attributeName="y" values="32;27;27;32" dur="6s" repeatCount="indefinite"/>
  </text>
  <circle cx="520" cy="44" r="12" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Work with magnetic hover effect -->
  <text x="580" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb" font-weight="500">
    Work
    <animate attributeName="y" values="32;27;27;32" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="580;582;585;580" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- About with magnetic effect -->
  <text x="635" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb" font-weight="500">
    About
    <animate attributeName="y" values="32;27;27;32" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="635;633;630;635" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Contact -->
  <text x="695" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb" font-weight="500">
    Contact
    <animate attributeName="y" values="32;27;27;32" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Scroll progress bar -->
  <rect x="0" y="73" width="800" height="2" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;200;200;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Scroll indicator text -->
  <text x="400" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4b5563" letter-spacing="1">
    ↓ SCROLL TO ANIMATE
  </text>

  <!-- Mouse cursor -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 100,0; 100,0; 0,0" dur="6s" repeatCount="indefinite"/>
    <path d="M 0 0 L 4 12 L 8 8 L 14 14 L 16 12 L 10 6 L 13 4 Z" fill="#a78bfa" opacity="0.6"/>
  </g>

  <!-- Decorative -->
  <text x="760" y="22" font-size="10" fill="#4b5563" font-family="monospace" opacity="0.5">glassmorphism</text>
  <text x="760" y="36" font-size="10" fill="#4b5563" font-family="monospace" opacity="0.5">magnetic hover</text>
  <text x="760" y="50" font-size="10" fill="#4b5563" font-family="monospace" opacity="0.5">scroll shrink</text>

  <!-- Label -->
  <text x="400" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563" letter-spacing="1">LIQUID NAVIGATION · LAB-001</text>
</svg>
